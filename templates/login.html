<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | Envío de correos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell login-shell">
    <header class="topbar">
      <div><p class="eyebrow">AUTOMATIZACIÓN DE CORREOS</p><h1>Iniciar sesión</h1></div>
    </header>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="notice {{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
    <section class="section">
      <form method="post" class="form-stack" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="field-label" for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="64" required autofocus>
        <label class="field-label" for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button primary" type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
